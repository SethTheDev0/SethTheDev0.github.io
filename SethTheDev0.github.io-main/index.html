<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SethTheDev - Developer portfolio showcasing game creations and projects" />
  <title>SethTheDev - Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- THEME TOGGLE -->
  <button id="theme-toggle" aria-label="Toggle between light and dark theme">
    <img src="assets/light-bulb.png" id="toggle-icon" alt="">
  </button>

  <!-- HEADER -->
  <header>
    <div class="header-container">
      <h1 class="logo">SethTheDev</h1>
      <nav aria-label="Main navigation">
        <a href="#about">About</a> |
        <a href="#creations">Creations</a> |
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- ABOUT -->
    <section id="about" class="about-container">
      <img src="assets/profile.png" alt="SethTheDev profile picture" class="profile-image">
    </section>

    <!-- CREATIONS -->
    <section id="creations" class="creations-section">
      <div class="creations-header">
        <h1>Creations</h1>
      </div>

      <!-- GALLERY -->
      <div class="gallery">
        <article class="gallery-frame">
          <h3 class="gallery-text">Bananaphobia</h3>
          <a href="https://www.roblox.com/games/90619700121422/Bananaphobia"
             target="_blank"
             rel="noopener noreferrer"
             class="gallery-icon-link"
             aria-label="View Bananaphobia game on Roblox">
            <div class="gallery-icon">
              <img src="assets/bananaphobia-icon.jpg">
            </div>
          </a>
        </article>
      </div>
    </section>

    <!-- CONTACT -->
    <section id="contact" class="contact-section">
      <!-- Add contact content here later -->
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
