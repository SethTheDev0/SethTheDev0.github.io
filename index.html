<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SethTheDev - Developer portfolio showcasing game creations and projects" />
  <title>SethTheDev</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- THEME TOGGLE -->
  <button id="theme-toggle">
    <img src="assets/light-bulb.png" id="toggle-icon">
  </button>

  <!-- HEADER -->
  <header>
    <div class="header-container">
      <h1 class="logo">SethTheDev</h1>
      <nav aria-label="Main navigation">
        <a href="#about">About</a> |
        <a href="#creations">Creations</a> |
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- ABOUT -->
    <section id="about" class="about-container">
      <h3 class="about-text">About Me</h3>
      <img src="assets/profile.png" class="profile-image">
      <div class="about-text">
      <!-- <p>Hey there! I'm SethTheDev,</p>
        <p>Feel free to explore my creations below and reach out if you'd like to collaborate or learn more about my work!</p>
      -->
      </div>
    </section>

    <!-- CREATIONS -->
    <section id="creations" class="creations-container">
      <div class="creations-header">
        <h1 class ="creations-title">Creations</h1>
      </div>

      <!-- GALLERY -->
      <div class="gallery">
        <article class="gallery-container">
          <h3 class="gallery-text">Bananaphobia</h3>
          <a href="https://www.roblox.com/games/90619700121422/Bananaphobia" target="_blank" rel="noopener noreferrer" class="gallery-icon-link" aria-label="View Bananaphobia game on Roblox">
            <div class="gallery-icon">
              <img src="assets/bananaphobia-icon.jpg" alt="Bananaphobia game icon">
            </div>
          </a>
        </article>
      </div>
    </section>

    <!-- CONTACT -->
    <section id="contact" class="contact-container">
      <!-- Add contact content here later -->
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
